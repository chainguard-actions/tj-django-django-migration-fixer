name: django-migration-fixer
description: Resolve django makemigrations multiple leaf nodes in the migration graph error
author: tj-actions
inputs:
  managepy-path:
    description: 'The location of manage.py.'
    required: true
    default: './manage.py'
  default-branch:
    description: 'The default branch or target branch of a Pull request: Defaults to github.base_ref'
    required: false
    default: ${{ github.base_ref }}
  force-update:
    description: 'Force update the target branch locally when git fetch fails.'
    required: false
  skip-default-branch-update:
    description: 'Skip pulling the latest changes from the default branch.'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - id: migration-fixer
      env:
        INPUT_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        INPUT_FORCE_UPDATE: ${{ inputs.force-update }}
        INPUT_SKIP_DEFAULT_BRANCH_UPDATE: ${{ inputs.skip-default-branch-update }}
        INPUT_MANAGEPY_PATH: ${{ inputs.managepy-path }}
      run: |
        DEFAULT_BRANCH="$INPUT_DEFAULT_BRANCH"

        EXTRA_ARGS="--fix"

        if [[ "$INPUT_FORCE_UPDATE" == 'true'  ]]; then
          EXTRA_ARGS+=" -f"
        fi

        if [[ "$INPUT_SKIP_DEFAULT_BRANCH_UPDATE" == 'true'  ]]; then
          EXTRA_ARGS+=" -s"
        fi

        python "$INPUT_MANAGEPY_PATH" makemigrations $EXTRA_ARGS -b "$DEFAULT_BRANCH"
      shell: bash
branding:
  icon: check
  color: white
